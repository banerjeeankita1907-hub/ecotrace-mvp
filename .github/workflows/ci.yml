name: EcoTrace CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run carbon calculation tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check src/carbon.js && node --check scripts/calculate-report.js
